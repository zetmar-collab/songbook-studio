appId: com.marek.songbookstudio
productName: Songbook Studio
copyright: Copyright © 2026 Marek

# better-sqlite3 ma już gotowy binarny build pod ABI Electrona 33 —
# nie kompilujemy ze źródeł (brak toolchainu C++ nie jest problemem).
npmRebuild: false

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Katalogi robocze i testowe nie trafiają do instalatora
  - '!src/**'
  - '!{_verify,_chk*,_shots,docs,tests,out-test,dist,.github,.claude,graphify-out}/**'
  - '!{vitest.config.ts,LICENSE}'
  - '!build/{appx,lib}/**'
  - '!build/*.{mjs,py}'
  # better-sqlite3: zostaje tylko gotowy plik .node, bez kodu źródłowego SQLite (kilkanaście MB)
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!**/*.{pdb,map,ts}'

# Tylko języki interfejsu, które obsługuje aplikacja (pl/en) — reszta to zbędne pliki locale Chromium
electronLanguages:
  - pl
  - en-US

asarUnpack:
  - resources/**
  - '**/*.node'

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # Bez spacji — inaczej GitHub zamienia spacje na kropki i psuje auto-aktualizacje
  artifactName: Songbook-Studio-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Songbook Studio

portable:
  artifactName: Songbook-Studio-${version}-portable.${ext}

# Pakiet MSIX dla Sklepu Microsoft budowany jest przez build/make-msix.mjs
# (Windows SDK), a nie przez cel `appx` electron-buildera — patrz README.

# Serwer aktualizacji (electron-updater) — GitHub Releases.
# Publikacja wydania:  npx electron-builder --win --publish always  (wymaga GH_TOKEN)
publish:
  provider: github
  owner: zetmar-collab
  repo: songbook-studio
